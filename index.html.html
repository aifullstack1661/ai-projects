<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>StockWise · Warehouse Inventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#18212f;--mu:#667085;--bd:#e2e7ef;--pri:#2457d6;--pri2:#e7eefc;--ok:#12a150;--warn:#d97706;--bad:#d92d20;--sh:0 1px 3px rgba(16,24,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--card:#171e29;--tx:#e8edf5;--mu:#98a2b3;--bd:#27313f;--pri:#6b94ff;--pri2:#1c2a4a;--sh:none}}
:root[data-theme="dark"]{--bg:#0f141c;--card:#171e29;--tx:#e8edf5;--mu:#98a2b3;--bd:#27313f;--pri:#6b94ff;--pri2:#1c2a4a;--sh:none}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--pri)}
#side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--card);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:4px;z-index:30;transition:transform .25s}
.logo{font-weight:700;font-size:18px;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}.logo b{background:var(--pri);color:#fff;border-radius:8px;padding:2px 8px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--tx);text-decoration:none;transition:background .15s}
.nav:hover{background:var(--bg)}.nav[aria-current=page]{background:var(--pri2);color:var(--pri);font-weight:600}
.nav em{margin-left:auto;font-style:normal;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
#wrap{margin-left:236px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:10px 20px}
#menu{display:none}
.sbox{position:relative;flex:1;max-width:520px}.sbox input{width:100%}
#sres{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-top:4px;max-height:320px;overflow:auto}
#sres button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer}#sres button:hover{background:var(--bg)}
main{padding:20px;max-width:1400px;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}.sub{color:var(--mu);margin:0 0 16px}
.grid{display:grid;gap:14px}.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;box-shadow:var(--sh);transition:transform .15s}
.kpi{cursor:pointer}.kpi:hover{transform:translateY(-2px)}.kpi .n{font-size:24px;font-weight:700}.kpi .l{color:var(--mu);font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-height:38px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;min-height:38px;transition:filter .15s}.btn:hover{filter:brightness(1.1)}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--bad)}.btn.x{padding:4px 8px;min-height:30px;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mu);background:var(--bg);position:sticky;top:0}th[data-k]{cursor:pointer}tr:hover td{background:var(--bg)}td.r,th.r{text-align:right}
.b{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.s-ok{background:#dcf5e7;color:#0b6b36}.s-low{background:#fdecc8;color:#8a4a02}.s-out,.s-neg{background:#fde1de;color:#a1180e}.s-demo{background:var(--pri2);color:var(--pri)}.s-you{background:#e5dcfb;color:#5b2fb6}
:root[data-theme=dark] .s-ok{background:#12351f;color:#6fe0a0}:root[data-theme=dark] .s-low{background:#3a2a0a;color:#f5c26b}:root[data-theme=dark] .s-out,:root[data-theme=dark] .s-neg{background:#431512;color:#ff9b92}
.hb{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:13px}.hb i{display:block;height:10px;border-radius:5px;background:var(--pri);transition:width .5s}.hb div{background:var(--bg);border-radius:5px}
.fld{display:flex;flex-direction:column;gap:3px}.fld label{font-weight:600;font-size:13px}.err{color:var(--bad);font-size:12px}.fld .bad{border-color:var(--bad)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
#modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal .box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto;animation:fade .2s}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ok);border-radius:8px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:fade .25s}.toast.err{border-left-color:var(--bad)}
.al{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.banner{background:var(--pri2);color:var(--pri);padding:10px 14px;border-radius:10px;margin-bottom:14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
@media(max-width:900px){#side{transform:translateX(-100%)}#side.open{transform:none}#wrap{margin-left:0}#menu{display:inline-block}main{padding:14px}.g2{grid-template-columns:1fr}}
@media print{#side,#top,.noprint,#toasts{display:none!important}#wrap{margin:0}body{background:#fff;color:#000}.tw{border:0}}
</style></head><body>
<nav id="side" aria-label="Main navigation"><div class="logo"><b>SW</b> StockWise</div></nav>
<div id="wrap"><header id="top">
<button id="menu" class="btn s" aria-label="Open menu" onclick="$('#side').classList.toggle('open')">☰</button>
<div class="sbox"><input id="gs" type="search" placeholder="Search name, SKU, ID, category, supplier, rack…" aria-label="Global search" autocomplete="off"><div id="sres" hidden></div></div>
<button class="btn s" id="th" onclick="theme()" aria-label="Toggle dark mode">🌙</button></header>
<main id="main" tabindex="-1"></main></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box" id="mbox"></div></div><div id="toasts" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0'),fD=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>fD(new Date());
const money=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),num=n=>Number(n).toLocaleString('en-US');
const CATS=['Electronics','Packaging','Tools','Safety Gear','Office Supplies','Spare Parts'],UNITS=['pcs','box','roll','set','pair','ream','kg','litre'],TYPES=['Stock In','Stock Out','Adjustment','Return'],U=['Priya S.','Rahul M.','Warehouse Admin'];
const SL={ok:'In Stock',low:'Low Stock',out:'Out of Stock',neg:'Negative Stock'};
function seed(){let r=11,n=1;const rnd=()=>(r=r*16807%2147483647)/2147483647,t=new Date(),items=[],moves=[];
const R=[['Barcode Scanner BS-20','Electronics','pcs',10,89,'TechSource Ltd','A-01-1',34],['Thermal Label Printer','Electronics','pcs',6,215,'TechSource Ltd','A-01-2',4],['Wireless Handheld Terminal','Electronics','pcs',5,420,'TechSource Ltd','A-02-1',0],['Lithium Battery Pack 12V','Electronics','pcs',20,38.5,'VoltEdge Supply','A-02-3',66],['Corrugated Box 40x30x30','Packaging','pcs',300,1.2,'PackRight Co','B-01-1',1850],['Stretch Film Roll 500mm','Packaging','roll',40,9.8,'PackRight Co','B-01-2',22],['Bubble Wrap 50m','Packaging','roll',25,14.5,'PackRight Co','B-02-1',88],['Packing Tape 48mm','Packaging','box',60,18,'PackRight Co','B-02-2',140],['Wooden Pallet 1200x800','Packaging','pcs',50,12,'Northwood Pallets','B-03-1',-4],['Cordless Drill 18V','Tools','pcs',8,96,'ToolMaster Inc','C-01-1',15],['Torque Wrench Set','Tools','set',5,134,'ToolMaster Inc','C-01-2',3],['Hand Pallet Jack','Tools','pcs',4,310,'LiftPro Equipment','C-02-1',9],['Safety Helmet','Safety Gear','pcs',40,11.5,'SafeGuard Ltd','D-01-1',120],['High-Vis Vest','Safety Gear','pcs',50,6.75,'SafeGuard Ltd','D-01-2',46],['Safety Gloves (pair)','Safety Gear','pair',80,3.2,'','D-02-1',260],['Steel-Toe Boots','Safety Gear','pair',20,48,'SafeGuard Ltd','D-02-2',0],['A4 Paper Ream','Office Supplies','ream',100,4.1,'OfficeHub','E-01-1',420],['Ballpoint Pens (box 50)','Office Supplies','box',15,7.9,'OfficeHub','E-01-2',32],['Thermal Receipt Rolls','Office Supplies','box',30,22,'OfficeHub','',18],['Conveyor Belt 5m','Spare Parts','pcs',3,260,'LiftPro Equipment','F-01-1',7],['Forklift Tyre','Spare Parts','pcs',6,175,'LiftPro Equipment','F-01-2',11],['Hydraulic Hose 2m','Spare Parts','pcs',12,28,'VoltEdge Supply','F-02-1',9],['LED High-Bay Light','Electronics','pcs',15,64,'VoltEdge Supply','A-03-1',52],['Rack Safety Netting','Safety Gear','roll',6,85,'SafeGuard Ltd','D-03-1',14]];
const dt=(mo,d)=>new Date(t.getFullYear(),t.getMonth()-mo,mo?d:Math.min(d,t.getDate())),C=['Apex Retail','BlueLine Logistics','Orion Works'];
R.forEach((x,i)=>{const id='ITM-'+(1001+i);let run=x[7]+Math.round(x[3]*3*rnd())+(i==3?300:0);
const it={id,name:x[0],sku:x[1].slice(0,3).toUpperCase()+'-'+(2100+i*13),cat:x[1],unit:x[2],min:x[3],price:x[4],sup:x[5],loc:x[6],desc:'Sample item for demonstration.',open:run,created:fD(new Date(t-(i*7+10)*864e5)),demo:1,upd:''};
const add=(d,type,delta,party,remark)=>{n++;moves.push({n,date:fD(d),itemId:id,type,delta,party,ref:{'Stock In':'PO-','Stock Out':'SO-','Return':'RT-','Adjustment':'ADJ-'}[type]+(1000+n),user:U[n%3],remark,demo:1});run+=delta;it.upd=fD(d)};
for(let mo=5;mo>=0;mo--){const q=Math.round(x[3]*(1+rnd()*3));add(dt(mo,2+Math.floor(rnd()*10)),'Stock In',q,x[5]||'Unknown supplier','Purchase receipt');
if(i==3&&mo==2)add(dt(2,20),'Adjustment',-300,'','Cycle count correction (write-off)');
if(mo==3&&i%4==0)add(dt(3,25),'Return',2+Math.floor(rnd()*3),C[i%3],'Customer return');
const o=Math.min(run,Math.round(x[3]*(.6+rnd()*2.2)));if(o>0)add(dt(mo,14+Math.floor(rnd()*12)),'Stock Out',-o,C[(i+mo)%3],'Customer order')}
const d=x[7]-run;if(d)add(t,d>0?'Stock In':'Stock Out',d,d>0?(x[5]||'Unknown supplier'):C[i%3],d>0?'Purchase receipt':'Customer order');items.push(it)});
return{items,moves,n}}
function load(){try{const s=localStorage.getItem('wms-v1');if(s)return JSON.parse(s)}catch(e){}return seed()}
let S=load(),L,DR=null,route='dash',editId=null,E={},F={q:'',cat:'',st:'',sup:'',loc:'',from:'',to:'',src:'',sort:'name',dir:1},R={type:'inv',from:'',to:'',cat:'',sup:''},MF={q:'',type:'',from:'',to:''};
function save(){try{localStorage.setItem('wms-v1',JSON.stringify(S))}catch(e){toast('Could not save to browser storage — changes will be lost on reload.','err')}}
function ledger(){const run={};S.items.forEach(i=>run[i.id]=i.open);const ms=[...S.moves].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.n-b.n).map(m=>{const p=run[m.itemId]??0;run[m.itemId]=p+m.delta;return{...m,prev:p,next:p+m.delta}});return{ms,cur:run}}
const cur=i=>L.cur[i.id],stat=i=>{const c=cur(i);return c<0?'neg':c==0?'out':c<=i.min?'low':'ok'},val=i=>cur(i)*i.price,badge=i=>`<span class="b s-${stat(i)}">${SL[stat(i)]}</span>`;
const nm=id=>(S.items.find(i=>i.id==id)||{name:'(deleted item)'}).name,sups=()=>[...new Set(S.items.map(i=>i.sup).filter(Boolean))].sort(),zones=()=>[...new Set(S.items.map(i=>(i.loc||'').split('-')[0]).filter(Boolean))].sort();
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3800)}
function modal(h){$('#mbox').innerHTML=h;$('#modal').style.display='flex';const f=$('#mbox input,#mbox select,#mbox button');f&&f.focus()}
function closeM(){$('#modal').style.display='none'}$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};document.addEventListener('keydown',e=>{if(e.key=='Escape'){closeM();$('#sres').hidden=true}});
let cfn;function confirmM(t,m,ok,fn){cfn=fn;modal(`<h2>${t}</h2><p>${m}</p><div class="bar" style="justify-content:flex-end"><button class="btn s" onclick="closeM()">Cancel</button><button class="btn d" onclick="closeM();cfn()">${ok}</button></div>`)}
function theme(){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark';$('#th').textContent=dk?'🌙':'☀️';try{localStorage.setItem('wms-theme',d.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem('wms-theme');if(t){document.documentElement.dataset.theme=t;$('#th').textContent=t=='dark'?'☀️':'🌙'}}catch(e){}
const NAV=[['dash','📊','Dashboard'],['inv','📦','Inventory'],['form','➕','Add Item'],['moves','🔁','Stock Movement'],['alerts','🔔','Alerts'],['rep','📄','Reports']];
function alerts(){const a=[];S.items.forEach(i=>{const s=stat(i),c=cur(i);if(s=='neg')a.push({t:'Negative stock',sev:3,id:i.id,m:`${i.name} shows ${num(c)} ${i.unit}. Check for unrecorded receipts or an over-issue.`});else if(s=='out')a.push({t:'Out of stock',sev:3,id:i.id,m:`${i.name} has no stock left (minimum ${num(i.min)}).`});else if(s=='low')a.push({t:'Low stock',sev:2,id:i.id,m:`${i.name}: ${num(c)} ${i.unit} on hand, minimum ${num(i.min)}.`});
const miss=[];if(!i.sup)miss.push('supplier');if(!i.loc)miss.push('warehouse location');if(!(i.price>0))miss.push('unit price');if(!i.desc)miss.push('description');if(miss.length)a.push({t:'Missing information',sev:1,id:i.id,m:`${i.name} is missing: ${miss.join(', ')}.`})});
const by={};L.ms.forEach(m=>(by[m.itemId]=by[m.itemId]||[]).push(m));Object.entries(by).forEach(([id,ms])=>ms.forEach((m,k)=>{if(k<3)return;const o=ms.slice(0,k).map(x=>Math.abs(x.delta)),avg=o.reduce((s,x)=>s+x,0)/o.length;if(Math.abs(m.delta)>=4*avg&&Math.abs(m.delta)>0)a.push({t:'Unusual stock change',sev:2,id,m:`${nm(id)}: ${m.type} of ${m.delta>0?'+':''}${num(m.delta)} on ${m.date} is ${(Math.abs(m.delta)/avg).toFixed(1)}× the item's earlier average movement (${m.ref}).`})}));
return a.sort((x,y)=>y.sev-x.sev)}
function render(){L=ledger();const A=alerts();$('#side').innerHTML='<div class="logo"><b>SW</b> StockWise</div>'+NAV.map(([r,ic,l])=>`<a class="nav" href="#${r}" ${r==route?'aria-current="page"':''}><span aria-hidden="true">${ic}</span>${l}${r=='alerts'&&A.length?`<em>${A.length}</em>`:''}</a>`).join('');
$('#side').classList.remove('open');$('#main').innerHTML=({dash,inv,form:formPg,moves:movesPg,alerts:alertsPg,rep:repPg}[route])(A);document.title='StockWise · '+NAV.find(n=>n[0]==route)[2];if(route=='inv')updInv();if(route=='moves')updMov()}
function go(r){route=r;DR=null;if(r=='form'&&location.hash!='#form')editId=null;E={};render();scrollTo(0,0)}
addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(NAV.some(n=>n[0]==r)){if(r=='form'&&!window._ed)editId=null;window._ed=0;go(r)}});
function bars(rows,f){const mx=Math.max(1,...rows.map(r=>r.v));return rows.map(r=>`<div class="hb"><span title="${esc(r.l)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.l)}</span><div><i style="width:${Math.max(2,r.v/mx*100)}%;background:${r.c||'var(--pri)'}"></i></div><b>${f(r.v)}</b></div>`).join('')||'<p class="sub">No data.</p>'}
function monthly(){const ms=[];for(let k=5;k>=0;k--){const d=new Date(new Date().getFullYear(),new Date().getMonth()-k,1);ms.push({k:d.getFullYear()+'-'+p2(d.getMonth()+1),l:d.toLocaleString('en',{month:'short'}),i:0,o:0})}
L.ms.forEach(m=>{const x=ms.find(y=>y.k==m.date.slice(0,7));if(x)m.delta>0?x.i+=m.delta:x.o-=m.delta});const mx=Math.max(1,...ms.flatMap(m=>[m.i,m.o]));
return`<svg viewBox="0 0 600 220" width="100%" role="img" aria-label="Monthly stock in and out">${ms.map((m,k)=>{const x=20+k*96,hi=m.i/mx*160,ho=m.o/mx*160;return`<rect x="${x}" y="${180-hi}" width="34" height="${hi}" rx="4" fill="var(--ok)"><title>${m.l} in: ${num(m.i)}</title></rect><rect x="${x+38}" y="${180-ho}" width="34" height="${ho}" rx="4" fill="var(--warn)"><title>${m.l} out: ${num(m.o)}</title></rect><text x="${x+36}" y="200" text-anchor="middle" fill="var(--mu)" font-size="12">${m.l}</text>`}).join('')}</svg><p class="sub"><span style="color:var(--ok)">■</span> Stock in (incl. returns/adjustments up) &nbsp;<span style="color:var(--warn)">■</span> Stock out</p>`}
function dash(A){const it=S.items,tq=it.reduce((s,i)=>s+Math.max(0,cur(i)),0),tv=it.reduce((s,i)=>s+val(i),0),low=it.filter(i=>stat(i)=='low'),out=it.filter(i=>stat(i)=='out'||stat(i)=='neg');
const K=[['Total Items',num(it.length),'inv',''],['Total Stock Qty',num(tq),'inv',''],['Inventory Value',money(tv),'rep','val'],['Low Stock Items',low.length,'inv','low'],['Out of Stock',out.length,'inv','out']];
const cat=CATS.map(c=>({l:c,q:0,v:0}));it.forEach(i=>{let x=cat.find(c=>c.l==i.cat);if(!x)cat.push(x={l:i.cat,q:0,v:0});x.q+=cur(i);x.v+=val(i)});
const hasDemo=it.some(i=>i.demo);
return`<h1>Dashboard</h1><p class="sub">Live overview of your warehouse. Stock = Opening + In − Out; Value = Stock × Unit Price.</p>
${hasDemo?`<div class="banner"><span>Sample demo data is loaded. Items you add are tagged <b>Yours</b> and kept separate.</span><button class="btn s x" onclick="clearDemo()">Remove demo data</button></div>`:!it.length?`<div class="banner"><span>No items yet.</span><button class="btn x" onclick="restoreDemo()">Load demo data</button></div>`:''}
<div class="grid g5">${K.map(k=>`<div class="card kpi" tabindex="0" role="link" onclick="${k[3]=='low'||k[3]=='out'?`F.st='${k[3]}';`:''}location.hash='#${k[2]}'"><div class="l">${k[0]}</div><div class="n">${k[1]}</div></div>`).join('')}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h2>Stock by Category</h2>${bars(cat.map(c=>({l:c.l,v:Math.max(0,c.q)})),num)}</div><div class="card"><h2>Inventory Value by Category</h2>${bars(cat.map(c=>({l:c.l,v:Math.max(0,c.v),c:'var(--ok)'})),money)}</div>
<div class="card"><h2>Monthly Stock In / Out</h2>${monthly()}</div><div class="card"><h2>Low &amp; Out-of-Stock Items</h2>${bars([...low,...out].sort((a,b)=>cur(a)/a.min-cur(b)/b.min).slice(0,8).map(i=>({l:i.name,v:Math.max(0,cur(i)),c:stat(i)=='low'?'var(--warn)':'var(--bad)'})),n=>num(n))||''}<p class="sub">Bars show units on hand (items at 0 or below show a minimal bar).</p></div>
<div class="card"><h2>Recently Added Items</h2>${[...it].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5).map(i=>`<div class="al"><span><b>${esc(i.name)}</b><br><span class="sub" style="margin:0">${esc(i.cat)} · added ${i.created}</span></span>${badge(i)}</div>`).join('')||'<p class="sub">No items.</p>'}</div>

if(qs===''||isNaN(q)||!Number.isInteger(q)||q==0)e.q='Enter a non-zero whole number.';else if(type!='Adjustment'&&q<0)e.q='Quantity must be positive (use Adjustment for reductions).';
